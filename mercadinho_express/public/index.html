<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Mercadinho Express</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <img src="./mercadinho-express-logo.png" alt="" width="200" height="200">
            <h1>Cadastro de produtos</h1>
        </header>
        <form id="formProduto">
            <div class="input">
                <label for="produto">Produto:</label>
                <input type="text" id="produto" class="produto" pattern="[A-Za-zÀ-ÿ\s]+" title="Digite apenas letras"
                    placeholder="Ex: Arroz">
            </div>


            <div class="input">
                <label for="quant">Quantidade:</label>
                <input type="number" id="quant" class="produto" required placeholder="Ex: 3">
            </div>


            <div class="input">
                <label for="preco">Preço:</label>
                <input type="number" id="preco" class="produto" required placeholder="Ex: 3">
            </div>

            <button type="submit">Adicionar</button>

        </form>

        <h2>Produtos cadastrados</h2>

        <div id="listaProdutos"></div>

        <script src="script.js"></script>
    </div>
</body>

</html>
