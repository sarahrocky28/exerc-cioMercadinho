<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Mercadinho Express</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <section>
            <img src="./mercadinho-express-logo.png" alt="" width="200" height="200">

            <form id="formProduto">
                <label for="produto">Produto:</label>
                <input type="text" id="produto" class="produto" required>



                <label for="quant">Quantidade:</label>
                <input type="number" id="quant" class="produto" required>



                <label for="preco">Preço</label>
                <input type="number" id="preco" class="produto" required>



                <button type="submit">Adicionar</button>
            </form>
        </section>

        <h2>Produtos cadastrados</h2>

        <div id="listaProdutos"></div>

        <script src="script.js"></script>
    </div>
</body>

</html>
